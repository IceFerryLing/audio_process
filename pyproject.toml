[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "syllable-recognition"
version = "0.1.0"
description = "Guided English syllable recognition data and model pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click==8.4.2",
  "cmudict==1.1.1",
  "g2p-en==2.1.0",
  "praatio==6.2.0",
  "PyYAML==6.0.3",
  "soundfile==0.14.0",
]

[project.optional-dependencies]
download = [
  "huggingface-hub==1.23.0",
  "pyarrow==25.0.0",
]
test = ["jsonschema==4.26.0"]
review = [
  "matplotlib==3.10.7",
  "numpy==1.26.4",
]
model-check = [
  "torch==2.9.1",
  "transformers==5.13.0",
]

[project.scripts]
sylrec = "syllable_recognition.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
