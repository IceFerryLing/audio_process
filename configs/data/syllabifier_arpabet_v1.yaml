# 确定性的词内ARPAbet音节化规则。
rule_version: arpabet-word-internal-v1
phone_system: arpabet
scope: word_internal
# 即使英语口语允许重音节化，也始终保留单词边界。
cross_word_resyllabification: false

# 只在判断元音集合时移除重音数字，最终仍将重音单独保存。
vowels:
  - AA
  - AE
  - AH
  - AO
  - AW
  - AY
  - EH
  - ER
  - EY
  - IH
  - IY
  - OW
  - OY
  - UH
  - UW

consonants:
  - B
  - CH
  - D
  - DH
  - F
  - G
  - HH
  - JH
  - K
  - L
  - M
  - N
  - NG
  - P
  - R
  - S
  - SH
  - T
  - TH
  - V
  - W
  - Y
  - Z
  - ZH

stress:
  values: [0, 1, 2]
  stored_separately_from_nucleus: true
  required_on_every_vowel: true

empty_classes:
  # 缺失的onset/coda使用显式空类别，供后续分类头使用。
  onset: <empty>
  coda: <empty>
  public_phone_array_representation: []

boundary_rules:
  # 两个元音核之间优先分配下方onset表允许的最长后缀。
  word_initial_consonants: onset_of_first_syllable
  word_final_consonants: coda_of_last_syllable
  intervocalic_cluster: longest_legal_onset_suffix
  no_legal_onset_suffix: entire_cluster_is_previous_coda
  tie_breaker: longest_suffix_then_lexical_order
  adjacent_vowels: separate_nuclei_with_empty_intervening_cluster

legal_intervocalic_onsets:
  # 列表顺序固定；每项是ARPAbet音素序列，不是字母拼写组合。
  - [B]
  - [CH]
  - [D]
  - [DH]
  - [F]
  - [G]
  - [HH]
  - [JH]
  - [K]
  - [L]
  - [M]
  - [N]
  - [P]
  - [R]
  - [S]
  - [SH]
  - [T]
  - [TH]
  - [V]
  - [W]
  - [Y]
  - [Z]
  - [ZH]
  - [B, L]
  - [B, R]
  - [B, Y]
  - [D, R]
  - [D, W]
  - [D, Y]
