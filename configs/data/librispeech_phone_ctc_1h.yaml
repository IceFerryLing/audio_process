# Stage 3一小时多说话人子集的Phone CTC标签构建契约。
config_version: librispeech-phone-ctc-1h-v1
stage: 3-phone-sequence-manifest
task: phone_ctc
mode: guided
seed: 1337

input:
  manifest: data/librispeech/train-clean-100/manifest.jsonl
  split: train-clean-100
  sample_rate: 16000
  channels: 1

labels:
  normalization_version: librispeech-english-v1
  dictionary: cmudict-1.1.1
  g2p: g2p_en-2.1.0
  stress: preserve
  vocabulary_source: train_only
  blank_token: <blank>
  unknown_token: <unk>
  blank_id: 0
  unknown_id: 1
  label_padding_id: -100

encoder:
  model_id: facebook/hubert-base-ls960
  local_path: assets/models/facebook-hubert-base-ls960
  revision: dba3bb02fda4248b6e082697eee756de8fe8aa8a

supervision:
  ordered_phone_sequences_from_text: true
  mfa_timestamps_used: false
  mfa_role: evaluation_only

output:
  manifest: artifacts/manifests/phone_ctc_train_clean_100_1h.jsonl
  vocabulary: artifacts/vocabs/phone_ctc_train_clean_100_1h.json
  report: artifacts/reports/phone_ctc_train_clean_100_1h_data.json
  resolved_config: artifacts/reports/phone_ctc_train_clean_100_1h_data_config.yaml

data_gate:
  expected_items: 289
  require_official_split: true
  require_ctc_feasible_lengths: true
  stop_on_failure: true
